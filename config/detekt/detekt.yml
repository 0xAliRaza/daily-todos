# Builds on detekt's default config; only the differences are listed here.
config:
  warningsAsErrors: true

complexity:
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 15
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    allowedFunctionParameters: 6
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 25
    allowedFunctionsPerObject: 20
    ignorePrivate: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**', '**/*.kts', '**/ui/theme/**']
    ignoreEnums: true
  ReturnCount:
    max: 4
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
